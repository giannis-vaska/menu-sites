<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Sites Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#14202b;--mut:#64727f;--ac:#0f766e;--acx:#fff;--bd:#d6dde3;--dng:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--tx:#e8eef3;--mut:#8b9aa7;--ac:#2dd4bf;--acx:#06201d;--bd:#2a3844;--dng:#f97066}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:720px;padding:16px 16px 60px;font:16px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:17px;margin:0}
input,select,button,.btn{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:10px 12px;background:var(--card);color:var(--tx)}
input,select{width:100%}
button,.btn{cursor:pointer;text-decoration:none;display:inline-block;font-size:14px;padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.primary{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.danger{color:var(--dng)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:140px;width:auto}
.row>select{flex:1;min-width:140px;width:auto}
.group{margin-top:22px}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.site{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;gap:8px}
.site b{font-size:16px}
.url{color:var(--ac);font-size:13px;word-break:break-all}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-left:6px}
.mut{color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const SUPABASE_URL = 'https://ssqyxamguwltrhelxpfs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzcXl4YW1ndXdsdHJoZWx4cGZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTI3ODIsImV4cCI6MjEwNzI4ODc4Mn0.62Q6CQXNSO-FsPT_NDhmN3DIrFMK4ibwsCDJV20GpAo';
const SB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
let groups = [], sites = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GR = {α:'a',β:'v',γ:'g',δ:'d',ε:'e',ζ:'z',η:'i',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'x',ο:'o',π:'p',ρ:'r',σ:'s',ς:'s',τ:'t',υ:'y',φ:'f',χ:'ch',ψ:'ps',ω:'o'};
const slugify = t => {
  let s = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  s = [...s].map(c => GR[c] ?? c).join('').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return s || 'site-' + Math.random().toString(36).slice(2, 6);
};
const link = slug => new URL('menu.html?r=' + encodeURIComponent(slug), location.href).href;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }

async function init() {
  const { data } = await SB.auth.getSession();
  data.session ? load() : showLogin();
}

function showLogin(msg = '') {
  app.innerHTML = `<h1>Menu Sites Admin</h1>
  <form class="panel stack" id="login">
    <input type="email" id="em" placeholder="Email" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="primary">Log in</button>
    <div class="mut" style="color:var(--dng)">${esc(msg)}</div>
  </form>`;
  document.getElementById('login').onsubmit = async e => {
    e.preventDefault();
    const { error } = await SB.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    error ? showLogin(error.message) : load();
  };
}

async function load() {
  const [g, r] = await Promise.all([
    SB.from('groups').select('*').order('sort_order').order('name'),
    SB.from('restaurants').select('*').order('name')
  ]);
  if (g.error || r.error) return toast((g.error || r.error).message);
  groups = g.data; sites = r.data; render();
}

function card(s) {
  const url = link(s.slug);
  const opts = `<option value="">No group</option>` + groups.map(g => `<option value="${g.id}" ${g.id === s.group_id ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
  return `<div class="site" data-id="${s.id}">
    <div><b>${esc(s.name)}</b>${s.is_active ? '' : '<span class="tag">hidden</span>'}</div>
    <a class="url" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>
    <div class="row">
      <button data-act="copy">Copy link</button>
      <button data-act="rename">Rename</button>
      <button data-act="slug">Change link</button>
      <a class="btn" href="editor.html?id=${s.id}">Edit menu</a>
    </div>
    <div class="row">
      <select data-act="move" aria-label="Group">${opts}</select>
      <button data-act="toggle">${s.is_active ? 'Hide' : 'Show'}</button>
      <button data-act="del" class="danger">Delete</button>
    </div>
  </div>`;
}

function render() {
  const gopts = `<option value="">No group</option>` + groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
  let html = `<div class="top"><h1>Menu Sites</h1><button data-act="logout">Log out</button></div>
  <form class="panel stack" id="newsite">
    <h2>Create a new menu site</h2>
    <input id="nname" placeholder="Restaurant or café name" required>
    <select id="ngroup" aria-label="Group">${gopts}</select>
    <button class="primary">Create site</button>
  </form>`;

  const sections = [...groups.map(g => ({ g, list: sites.filter(s => s.group_id === g.id) }))];
  const loose = sites.filter(s => !s.group_id || !groups.some(g => g.id === s.group_id));
  if (loose.length || !groups.length) sections.push({ g: null, list: loose });

  for (const { g, list } of sections) {
    html += `<div class="group"><div class="ghead"><h2>${g ? esc(g.name) : 'No group'} <span class="mut">(${list.length})</span></h2>
      ${g ? `<span class="row"><button data-act="grename" data-gid="${g.id}">Rename</button><button data-act="gdel" data-gid="${g.id}" class="danger">Delete</button></span>` : ''}</div>
      ${list.map(card).join('') || '<div class="mut">No sites here yet.</div>'}</div>`;
  }

  html += `<form class="panel stack group" id="newgroup"><h2>Add a category</h2>
    <div class="row"><input id="gname" placeholder="e.g. Cafés, Souvlaki, Bars" required><button class="primary">Add</button></div></form>`;
  app.innerHTML = html;

  document.getElementById('newsite').onsubmit = createSite;
  document.getElementById('newgroup').onsubmit = async e => {
    e.preventDefault();
    const { error } = await SB.from('groups').insert({ name: gname.value.trim(), sort_order: groups.length });
    error ? toast(error.message) : load();
  };
}

async function createSite(e) {
  e.preventDefault();
  const name = nname.value.trim();
  const base = slugify(name);
  const group_id = ngroup.value || null;
  let slug = base, n = 1, res;
  while (true) {
    res = await SB.from('restaurants').insert({ name, slug, group_id }).select().single();
    if (res.error && res.error.code === '23505') { n++; slug = base + '-' + n; continue; }
    break;
  }
  if (res.error) return toast(res.error.message);
  await SB.from('menu_categories').insert([
    { restaurant_id: res.data.id, name: 'Food', sort_order: 0 },
    { restaurant_id: res.data.id, name: 'Drinks', sort_order: 1 }
  ]);
  toast('Site created');
  load();
}

async function upd(table, id, patch) {
  const { error } = await SB.from(table).update(patch).eq('id', id);
  error ? toast(error.message) : load();
}

app.addEventListener('change', e => {
  const sel = e.target.closest('select[data-act="move"]');
  if (sel) upd('restaurants', sel.closest('.site').dataset.id, { group_id: sel.value || null });
});

app.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'logout') { await SB.auth.signOut(); return showLogin(); }
  if (b.dataset.gid) {
    const g = groups.find(x => x.id === b.dataset.gid);
    if (act === 'grename') { const v = prompt('Category name', g.name); if (v && v.trim()) upd('groups', g.id, { name: v.trim() }); }
    if (act === 'gdel' && confirm(`Delete category "${g.name}"? Its sites will move to "No group".`)) {
      const { error } = await SB.from('groups').delete().eq('id', g.id);
      error ? toast(error.message) : load();
    }
    return;
  }
  const card = b.closest('.site'); if (!card) return;
  const s = sites.find(x => x.id === card.dataset.id);
  if (act === 'copy') { try { await navigator.clipboard.writeText(link(s.slug)); toast('Link copied'); } catch { prompt('Copy this link', link(s.slug)); } }
  if (act === 'rename') { const v = prompt('Site name', s.name); if (v && v.trim()) upd('restaurants', s.id, { name: v.trim() }); }
  if (act === 'slug') { const v = prompt('Link name (letters, numbers, dashes). Changing it breaks the old link and any printed QR codes.', s.slug); if (v && v.trim()) upd('restaurants', s.id, { slug: slugify(v) }); }
  if (act === 'toggle') upd('restaurants', s.id, { is_active: !s.is_active });
  if (act === 'del' && confirm(`Delete "${s.name}" and its whole menu? This cannot be undone.`)) {
    const { error } = await SB.from('restaurants').delete().eq('id', s.id);
    error ? toast(error.message) : load();
  }
});

init();
</script>
</body>
</html>
