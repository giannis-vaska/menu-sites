<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17191c">
<title>Menu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fbfbfa;--tx:#17191c;--mut:#6b7178;--ln:#c9cdd1;--chip:#eceeef;--ac:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#121416;--tx:#eef0f1;--mut:#9aa1a8;--ln:#454b51;--chip:#22262a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 60px}
header{border-top:8px solid var(--ac);padding:28px 0 18px}
h1{font:700 34px/1.1 Georgia,"Times New Roman",serif;margin:0 0 8px;overflow-wrap:anywhere}
.desc{margin:0 0 12px;color:var(--mut)}
.info{display:flex;flex-wrap:wrap;gap:8px}
.info a{color:var(--tx);text-decoration:none;font-size:14px;background:var(--chip);border-radius:999px;padding:7px 13px}
#bgimg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center}
#bgov{position:fixed;inset:0;z-index:-1}
.hasimg nav{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
nav{position:sticky;top:0;background:var(--nav,var(--bg));z-index:5;padding:10px 0;border-bottom:1px solid var(--ln);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--tx);text-decoration:none;font-size:14px;background:var(--chip);border-radius:999px;padding:7px 14px}
a:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
section{margin-top:30px}
h2{font:700 24px/1.2 Georgia,"Times New Roman",serif;margin:0 0 6px;padding-bottom:8px;border-bottom:3px solid var(--ac)}
.item{padding:12px 0}
.line{display:flex;align-items:baseline;gap:8px}
.name{font-weight:600}
.leader{flex:1;border-bottom:2px dotted var(--ln);transform:translateY(-4px);min-width:16px}
.price{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.d{color:var(--mut);font-size:14px;margin-top:2px;max-width:85%}
.off .name,.off .price{opacity:.45;text-decoration:line-through}
.off .d{opacity:.6}
.sold{font-size:12px;color:var(--mut);border:1px solid var(--ln);border-radius:6px;padding:1px 6px}
.msg{padding:80px 0;text-align:center;color:var(--mut)}
.logo{display:block;max-width:140px;max-height:84px;object-fit:contain;margin:0 0 14px}
.item.has{display:flex;gap:14px;align-items:flex-start}
.item .body{flex:1;min-width:0}
.ph{flex:none;width:88px;height:88px;object-fit:cover;border-radius:10px;background:var(--chip)}
.off .ph{opacity:.45}
.info a.call{background:var(--ac);color:var(--acx,#fff);font-weight:700;font-size:15px;padding:10px 18px;box-shadow:0 4px 0 rgba(0,0,0,.28);transform:rotate(-2deg);transition:transform .15s,box-shadow .15s}
.info a.call:active{transform:translateY(3px) rotate(0);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.call .ico{display:inline-block;transform-origin:50% 60%;animation:ring 3s ease-in-out infinite}
@keyframes ring{0%,62%,100%{transform:rotate(0)}66%{transform:rotate(-18deg)}70%{transform:rotate(16deg)}74%{transform:rotate(-14deg)}78%{transform:rotate(10deg)}82%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.call .ico{animation:none}}
header.center{text-align:center}
header.center .logo{margin-left:auto;margin-right:auto}
header.center .info{justify-content:center}
header.right{text-align:right}
header.right .logo{margin-left:auto}
header.right .info{justify-content:flex-end}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Loading…</div></div>
<script>
const SB = supabase.createClient('https://ssqyxamguwltrhelxpfs.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzcXl4YW1ndXdsdHJoZWx4cGZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTI3ODIsImV4cCI6MjEwNzI4ODc4Mn0.62Q6CQXNSO-FsPT_NDhmN3DIrFMK4ibwsCDJV20GpAo');
const app = document.getElementById('app');
const slug = new URLSearchParams(location.search).get('r');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fail = m => { app.innerHTML = `<div class="msg">${m || 'This menu is not available.'}</div>`; };
const okColor = c => /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#e11d48';

function applyBg(R) {
  const hex = /^#[0-9a-fA-F]{6}$/.test(R.bg_color || '') ? R.bg_color : null, img = R.bg_image_url;
  if (!hex && !img) return;
  const base = hex || '#000000', n = parseInt(base.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const dark = (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.5, s = document.documentElement.style;
  s.setProperty('--bg', base);
  if (dark) { s.setProperty('--tx', '#f4f5f6'); s.setProperty('--mut', '#b9bfc5'); s.setProperty('--ln', 'rgba(255,255,255,.28)'); s.setProperty('--chip', 'rgba(255,255,255,.14)'); }
  else { s.setProperty('--tx', '#17191c'); s.setProperty('--mut', '#555c63'); s.setProperty('--ln', 'rgba(0,0,0,.22)'); s.setProperty('--chip', 'rgba(0,0,0,.07)'); }
  document.querySelector('meta[name=theme-color]').content = base;
  if (img) {
    const dim = Math.min(90, Math.max(0, Number(R.bg_dim ?? 60))) / 100;
    s.setProperty('--nav', `rgba(${r},${g},${b},.22)`);
    document.body.classList.add('hasimg');
    const i = document.createElement('div'); i.id = 'bgimg'; i.style.backgroundImage = `url("${img.replace(/"/g, '%22')}")`;
    const o = document.createElement('div'); o.id = 'bgov'; o.style.background = base; o.style.opacity = dim;
    document.body.prepend(i, o);
  }
}

async function init() {
  if (!slug) return fail();
  const r = await SB.from('restaurants').select('*').eq('slug', slug).maybeSingle();
  if (r.error) return fail('Could not load the menu. Please try again.');
  const R = r.data;
  if (!R || !R.is_active) return fail();
  const c = await SB.from('menu_categories').select('*').eq('restaurant_id', R.id).order('sort_order');
  if (c.error) return fail('Could not load the menu. Please try again.');
  const cats = c.data; let items = [];
  if (cats.length) {
    const i = await SB.from('menu_items').select('*').in('category_id', cats.map(x => x.id)).order('sort_order');
    if (i.error) return fail('Could not load the menu. Please try again.');
    items = i.data;
  }
  document.title = R.name;
  const ac = okColor(R.accent_color), an = parseInt(ac.slice(1), 16);
  document.documentElement.style.setProperty('--ac', ac);
  document.documentElement.style.setProperty('--acx', (0.299 * (an >> 16) + 0.587 * ((an >> 8) & 255) + 0.114 * (an & 255)) / 255 > 0.6 ? '#17191c' : '#ffffff');
  applyBg(R);
  const cur = R.currency || '€';
  const fmt = p => { const n = Number(p).toFixed(2); return cur === '€' ? n.replace('.', ',') + ' €' : cur + n; };
  const tel = (R.phone || '').replace(/[^\d+]/g, '');

  const shown = cats.map(c => ({ c, list: items.filter(i => i.category_id === c.id) })).filter(x => x.list.length);
  let h = `<header class="${['center', 'right'].includes(R.header_align) ? R.header_align : ''}">${R.logo_url ? `<img class="logo" src="${esc(R.logo_url)}" alt="${esc(R.name)} logo">` : ''}<h1>${esc(R.name)}</h1>${R.description ? `<p class="desc">${esc(R.description)}</p>` : ''}<div class="info">
    ${tel ? `<a class="call" href="tel:${esc(tel)}"><span class="ico">📞</span> Call ${esc(R.phone)}</a>` : ''}
    ${R.address ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(R.address)}" target="_blank" rel="noopener">${esc(R.address)}</a>` : ''}</div></header>`;
  if (!shown.length) { h += '<div class="msg">The menu is coming soon.</div>'; app.innerHTML = h; return; }
  h += `<nav aria-label="Menu categories">${shown.map(({ c }) => `<a href="#c-${c.id}">${esc(c.name)}</a>`).join('')}</nav>`;
  for (const { c, list } of shown) {
    h += `<section id="c-${c.id}"><h2>${esc(c.name)}</h2>` + list.map(i => `
      <div class="item ${i.available ? '' : 'off'} ${i.image_url ? 'has' : ''}">
        ${i.image_url ? `<img class="ph" loading="lazy" src="${esc(i.image_url)}" alt="${esc(i.name)}">` : ''}
        <div class="body">
          <div class="line"><span class="name">${esc(i.name)}</span><span class="leader"></span>${i.available ? '' : '<span class="sold">Sold out</span>'}<span class="price">${fmt(i.price)}</span></div>
          ${i.description ? `<div class="d">${esc(i.description)}</div>` : ''}
        </div>
      </div>`).join('') + '</section>';
  }
  app.innerHTML = h;
}
init();
</script>
</body>
</html>
